<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ES decision trees: sensitivity and pinch points</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8f6;--card:#fff;--ink:#1d2a22;--muted:#5b6b61;--line:#e1e6e2;--accent:#00703c;--flag:#b2182b}
@media (prefers-color-scheme:dark){:root{--bg:#111612;--card:#1a211c;--ink:#e6ece7;--muted:#9fb0a5;--line:#2c372f;--accent:#4cc38a;--flag:#f28b82}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:24px 22px 60px}
h1{font-size:25px;margin:0 0 6px}h2{font-size:19px;margin:0 0 4px}h3{font-size:14px;margin:0 0 6px;font-weight:600}
.lede{color:var(--muted);max-width:860px;margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1200px;margin:0 auto;padding:10px 22px;display:flex;gap:6px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:18px 0}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:880px}
.find{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.f{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.f b{display:block;margin-bottom:2px}.f .k{font-size:21px;font-weight:600;color:var(--accent);margin-right:4px}.f.warn .k{color:var(--flag)}
table.t{border-collapse:collapse;font-size:13px;width:100%}
table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
.pass{color:var(--accent);font-weight:600}.flag{color:var(--flag);font-weight:600}
.grid{border-collapse:separate;border-spacing:2px;font-size:12px;font-variant-numeric:tabular-nums}
.grid td.c{width:34px;height:28px;text-align:center;border-radius:4px;font-weight:500}
.grid.sm td.c{width:25px;height:22px;font-size:10.5px;border-radius:3px}
.grid th{font-weight:400;color:var(--muted);font-size:11px;padding:0 4px;white-space:nowrap}
.panels{display:flex;flex-wrap:wrap;gap:14px}
.panel h4{margin:0 0 3px;font-size:12px;font-weight:600;color:var(--muted)}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.ctrl button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ctrl button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.bar{height:12px;width:150px;border-radius:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media (max-width:880px){.row2{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:190px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.track{height:15px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.s1{position:absolute;left:0;top:0;bottom:0;background:#2a6fdb}.ia{position:absolute;top:0;bottom:0;background:#9ec1f5}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.mark{background:#b2182b;color:#fff;padding:0 3px;border-radius:3px;font-weight:700}
#tip{position:fixed;pointer-events:none;background:#1d2a22;color:#fff;font-size:12px;padding:7px 9px;border-radius:6px;max-width:280px;opacity:0;z-index:9}
pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.dist{display:flex;gap:4px;align-items:flex-end;height:90px;border-bottom:1px solid var(--line)}
.dist div{flex:1;border-radius:3px 3px 0 0}
.mini .hb{grid-template-columns:120px 1fr 38px;font-size:12px}
.lb{height:10px;background:#b2182b;border-radius:3px;display:inline-block;vertical-align:middle}
</style>
</head>

const lab = (k, v) => R.es[k].inputs[v] || v;
function sobolBars(k, data, scale = 0.7){
  const s = [...data].sort((a,b) => b.total - a.total);

}
function distBars(d, d2){
  const mx = Math.max(...d, ...(d2||[]));
  return `<div class="dist">${d.map((v,i)=>`<div data-tip="${esc(`Score ${i+1}: ${pct(v,1)} of combinations`)}" style="height:${v/mx*100}%;background:${SC[i+1]}"></div>`).join("")}</div><div style="display:flex;gap:4px;font-size:11px;color:var(--muted)">${[1,2,3,4,5].map(i=>`<div style="flex:1;text-align:center">${i}</div>`).join("")}</div>`;
}

}
function pairMatrix(k){
  const ins = Object.keys(R.es[k].inputs), P = R.es[k].sobol.pairs; if (!P.length) return "";
  const mx = Math.max(...P.map(p=>p.S2), 1e-9);

  ins.forEach(a => { h += `<tr><th>${a.toUpperCase()}</th>` + ins.map(b => { if (a===b) return `<td class="c" style="color:var(--muted)">–</td>`;
    const p = P.find(x => (x.a===a&&x.b===b)||(x.a===b&&x.b===a)); const t = p.S2/mx;
    return `<td class="c" style="width:52px;background:${blue(t)};color:${ink(t)}" data-tip="${esc(`<b>${lab(k,a)} × ${lab(k,b)}</b><br>${pct(p.S2,1)} of variance from this pair together`)}">${pct(p.S2,1)}</td>`; }).join("") + "</tr>"; });
  return h + "</table>";
}
function corrMatrix(k){

  return h + `</table><div class="legend"><span>−1</span><span class="bar" style="background:linear-gradient(90deg,#b2182b,#f2f2f2,#2166ac)"></span><span>+1</span></div>`;
}
function drawFlips(k, mode){

}
function drawHS(k, mode){
  const E = R.es[k], L = E.hotspot_layout, H = E.hotspots;
  const lv = v => E.levels[v];
  const rows = L.row ? lv(L.row) : [null], cols = L.col ? lv(L.col) : [null];
  const many = rows.length * cols.length > 12;
  let h = "";
  rows.forEach(rv => {
    if (L.row) h += `<h3 style="margin:10px 0 6px">${lab(k,L.row)} = ${ab(rv)}</h3>`;
    h += `<div class="panels">`;
    cols.forEach(cv => {
      h += `<div class="panel">${L.col?`<h4>${lab(k,L.col).split(" ")[0]} = ${ab(cv)}</h4>`:""}<table class="grid ${many?"sm":""}"><tr><th style="font-size:9.5px">${L.y.toUpperCase()}↓ ${L.x.toUpperCase()}→</th>${lv(L.x).map(x=>`<th>${ab(x)}</th>`).join("")}</tr>`;
      [...lv(L.y)].reverse().forEach(yv => {
        h += `<tr><th>${ab(yv)}</th>` + lv(L.x).map(xv => {
          const sel = H.filter(d => String(d[L.x])===xv && String(d[L.y])===yv && (!L.col||String(d[L.col])===cv) && (!L.row||String(d[L.row])===rv));
          const sens = sel.reduce((s,d)=>s+d.change_share,0)/sel.length, sc = sel.reduce((s,d)=>s+d.score,0)/sel.length;
          const jump = Math.max(...sel.map(d=>d.max_jump)), pv = sel.reduce((s,d)=>s+(d.perverse>0?1:0),0);
          let bg, fg, txt;
          if (mode==="score") { bg = scoreCol(sc); fg = scoreInk(sc); txt = Number.isInteger(sc)?sc:sc.toFixed(1); }
          else if (mode==="jump") { bg = red(jump/2); fg = ink(jump/2); txt = jump; }
          else { bg = blue(sens); fg = ink(sens); txt = Math.round(sens*100); }
          if (pv && mode!=="score") txt = `<span class="mark">!</span>`;
          const t = `<b>${L.y.toUpperCase()} ${ab(yv)} · ${L.x.toUpperCase()} ${ab(xv)}${L.col?` · ${L.col.toUpperCase()} ${ab(cv)}`:""}${L.row?` · ${L.row.toUpperCase()} ${ab(rv)}`:""}</b><br>${sel.length>1?`Averaged over ${sel.length} combinations<br>`:""}Score: ${sc.toFixed(sel.length>1?2:0)}<br>One-step changes that move it: ${pct(sens)}<br>Largest jump: ${jump}${pv?`<br><b>${pv} combination(s) where an improvement lowers the score</b>`:""}`;
          return `<td class="c" style="background:${bg};color:${fg}" data-tip="${esc(t)}">${txt}</td>`; }).join("") + "</tr>";
      });
      h += "</table></div>";
    });
    h += "</div>";
  });
  const el = document.getElementById("hs-"+k); el.innerHTML = h; bindTips(el);
  document.getElementById("hsl-"+k).innerHTML = mode==="score" ? "Score " + [1,2,3,4,5].map(i=>`<span class="sw" style="background:${SC[i]}"></span>${i}`).join(" ")
    : mode==="jump" ? `<span>Largest one-step jump: 0</span><span class="bar" style="background:linear-gradient(90deg,#fbeee9,#b2182b)"></span><span>2 levels</span>`
    : `<span>One-step changes that move the score: 0%</span><span class="bar" style="background:linear-gradient(90deg,#eef3fb,#0b3d91)"></span><span>100%</span>`;
}
function drawPairs(k){
  const el = document.getElementById("pairs-"+k); if (!el) return; const E = R.es[k], P = E.pairs;
  const combos = [...new Set(P.map(p => p.a+"|"+p.b))];
  el.innerHTML = combos.map(c => { const [a,b] = c.split("|"); const rows = P.filter(p=>p.a===a&&p.b===b);
    let h = `<div class="panel"><h4>${b.toUpperCase()} (rows) × ${a.toUpperCase()} (cols)</h4><table class="grid sm"><tr><th></th>${E.levels[a].map(x=>`<th>${ab(x).slice(0,6)}</th>`).join("")}</tr>`;
    [...E.levels[b]].reverse().forEach(yv => { h += `<tr><th>${ab(yv).slice(0,8)}</th>` + E.levels[a].map(xv => { const d = rows.find(r=>String(r.xv)===xv&&String(r.yv)===yv);
      return `<td class="c" style="background:${blue(d.sens)};color:${ink(d.sens)}" data-tip="${esc(`<b>${lab(k,b)} = ${ab(yv)}, ${lab(k,a)} = ${ab(xv)}</b><br>Mean sensitivity: ${pct(d.sens)}<br>Mean score: ${d.score.toFixed(2)}${d.perverse?`<br>${d.perverse} combos where an improvement lowers the score`:""}`)}">${Math.round(d.sens*100)}</td>`; }).join("") + "</tr>"; });
    return h + "</table></div>"; }).join("");
  bindTips(el);
}
function drawRules(k){
  const E = R.es[k], RU = E.rules, mx = Math.max(...RU.map(r=>r.change_share), 1e-9);
  document.getElementById("rmax-"+k).textContent = pct(mx,1);
  const params = [...new Set(RU.map(r=>r.param))]; let h = `<div class="panels" style="gap:26px">`;
  params.forEach(pn => { const rs = RU.filter(r=>r.param===pn);
    if (rs[0].kind === "matrix") {
      const m = rs[0].label.match(/\[(\w+)=\d+, (\w+)=\d+\]/); const rn = m?m[1]:"row", cn = m?m[2]:"col";
      h += `<div class="panel"><h3>${pn} lookup</h3><table class="grid"><tr><th style="font-size:10px">${rn}↓ ${cn}→</th>${[1,2,3,4,5].map(c=>`<th>${c}</th>`).join("")}</tr>`;
      [1,2,3,4,5].forEach(r => { h += `<tr><th>${r}</th>` + [1,2,3,4,5].map(c => { const x = rs.find(q=>q.row===r&&q.col===c); const t = x.change_share/mx;
        return `<td class="c" style="background:${red(t)};color:${ink(t)}" data-tip="${esc(`<b>${x.label}</b><br>Current output: ${x.value}<br>Changing it by ±1 alters ${pct(x.change_share,1)} of final scores`)}">${x.value}</td>`; }).join("") + "</tr>"; });
      h += "</table></div>";
    } else if (pn === "Leaves") {
      h += `<div class="panel" style="flex:1;min-width:520px"><h3>Leaf scores of the nested tree (in rule order)</h3><table class="t">${rs.map(x => `<tr data-tip="${esc(`<b>${x.label}</b><br>Leaf score ${x.value}; changing it by ±1 alters ${pct(x.change_share,1)} of final scores`)}"><td style="font-size:12px">${x.label.replace(/\d(,\d)+/g, m => { const a = m.split(","); return a[0] + "–" + a[a.length-1]; }).replace(/\*/g,"any")}</td><td><span class="sw" style="background:${SC[x.value]}"></span>${x.value}</td><td style="width:200px;white-space:nowrap"><span class="lb" style="width:${x.change_share/mx*120}px;background:${red(.25+.75*x.change_share/mx)}"></span> ${pct(x.change_share,1)}</td></tr>`).join("")}</table></div>`;
    } else {
      h += `<div class="panel"><h3>${pn.replace(/_/g," ")}</h3><table class="grid"><tr>${rs.map(x=>`<th>${ab(x.label)}</th>`).join("")}</tr><tr>${rs.map(x => { const t = x.change_share/mx;
        return `<td class="c" style="width:64px;background:${red(t)};color:${ink(t)}" data-tip="${esc(`<b>${pn.replace(/_/g," ")}: ${x.label}</b><br>Current value: ${x.value>0?"+":""}${x.value}<br>Changing it by ±1 alters ${pct(x.change_share,1)} of final scores`)}">${x.value>0?"+":""}${x.value}</td>`; }).join("")}</tr></table></div>`;
    }
  });
  const el = document.getElementById("rules-"+k); el.innerHTML = h + "</div>"; bindTips(el);
}

/* ------------------------------ Overview --------------------------------- */
function overview(){
  const C = R.compare;
  let h = `<h1>Ecosystem service decision trees: sensitivity and pinch points</h1><p class="lede">All five decision trees were wrapped as functions, validated against the original R script, and run over every valid input combination (${C.reduce((s,c)=>s+c.combinations,0).toLocaleString()} in total), so every figure is exact. Use the tabs for each ES in detail.</p>`;
  h += `<section><h2>Cross-ES summary</h2><table class="t"><tr><th>ES</th><th>Inputs</th><th>Top driver</th><th>Interactions</th><th>Mean sensitivity</th><th>Non-monotonic</th><th>2-level jumps</th><th>Dead steps</th><th>Score 1 or 5</th><th>Mean score</th></tr>${C.map(c=>`<tr><td><a href="#${SLUG[c.es]}" style="color:var(--accent)">${c.name}</a></td><td>${c.n_inputs}</td><td>${lab(c.es,c.top_driver)} (${pct(c.top_total)})</td><td>${pct(c.interaction_share)}</td><td>${pct(c.mean_sensitivity)}</td><td class="${c.monotonic_violations?"flag":"pass"}">${c.monotonic_violations}</td><td>${pct(c.big_jump_rate,1)}</td><td class="${c.dead_steps?"flag":""}">${c.dead_steps} of ${c.total_steps}</td><td>${pct(c.extremes)}</td><td>${c.mean_score.toFixed(2)}</td></tr>`).join("")}</table>
  <p class="sub" style="margin-top:10px"><b>Mean sensitivity</b> = average share of one-step changes that move the score. <b>Dead steps</b> = one-step improvements that never change the score.</p></section>`;
  h += `<section><h2>What the five trees have in common</h2><div class="find">
   <div class="f warn"><b>Missing data is rewarded everywhere</b>Every tree has at least one input where a missing value scores better than the worst observed value, from 50% of cases (habitat) to 80% (water supply). Missing values skip penalties instead of carrying uncertainty.</div>
   <div class="f warn"><b>Two trees break monotonicity</b>Recreation (15 cases) and habitat (2 cases) contain rules where improving an indicator lowers the score. Water flow, water quality and supply are monotonic.</div>
   <div class="f warn"><b>Scores aren't on a common scale</b>Under identical uniform inputs, recreation averages 3.5 while habitat averages 2.0 (75% of habitat scores are 1–2). Equal indicator quality gives very different ES scores.</div>
   <div class="f"><b>Influence is concentrated</b>In every tree, one indicator explains 35–84% of variance: R14, R1, R24, R3 and R26. Water quality is the most balanced; water supply the least.</div>
   <div class="f warn"><b>1–5 indicators often act as 3 bands</b>Habitat (6 dead steps), recreation (R11 3→5) and water supply (R27) ignore some one-step changes entirely. The quintile resolution is partly lost.</div>
   <div class="f"><b>Two families of tree</b>Recreation and water quality are "lookup grid + ±1 adjustment" trees; water flow and water quality chain ±1 adjustments with clamping; habitat is the only nested veto tree; water supply is a simple penalty.</div>
  </div></section>`;
  h += `<section><h2>Which indicators drive each ES</h2><div class="mini">${ORDER.map(k=>`<div><h3>${R.es[k].name}</h3>${sobolBars(k,R.es[k].sobol.indices,1)}</div>`).join("")}</div><div class="legend"><span><span class="sw" style="background:#2a6fdb"></span>On its own</span><span><span class="sw" style="background:#9ec1f5"></span>Through interactions</span></div></section>`;
  h += `<section><h2>Do scores pile up at the extremes?</h2><p class="sub">Final-score distribution for each ES under uniform inputs.</p><div class="mini">${ORDER.map(k=>`<div><h3>${R.es[k].name}</h3>${distBars(R.es[k].dist)}<p class="sub" style="margin:6px 0 0;font-size:12px">${pct(R.es[k].dist[0]+R.es[k].dist[4])} at 1 or 5 · mean ${R.es[k].dist.reduce((s,v,i)=>s+v*(i+1),0).toFixed(2)}</p></div>`).join("")}</div></section>`;
  // all transitions league
  const all = ORDER.flatMap(k => R.es[k].flips.map(f => ({...f, es:k})));
  const top = [...all].sort((a,b) => (b.big_jump_rate*3+b.down_rate*3+b.flip_rate) - (a.big_jump_rate*3+a.down_rate*3+a.flip_rate)).slice(0,12);
  h += `<section><h2>Pinch-point league table</h2><p class="sub">The 12 most sensitive one-step changes across all trees, ranked by how often they flip, jump or drop the score.</p><table class="t"><tr><th>ES</th><th>Step</th><th>Changes score</th><th>Jumps 2+</th><th>Lowers score</th></tr>${top.map(f=>`<tr><td>${R.es[f.es].name}</td><td>${lab(f.es,f.input)} ${f.transition.split("->").map(ab).join("→")}</td><td>${pct(f.flip_rate)}</td><td class="${f.big_jump_rate?"flag":""}">${pct(f.big_jump_rate)}</td><td class="${f.down_rate?"flag":""}">${pct(f.down_rate)}</td></tr>`).join("")}</table></section>`;
  const S = R.shared_r11;
  h += `<section><h2>Shared indicator: R11 links recreation and water quality</h2><div class="row2"><div><table class="t"><tr><th>R11</th><th>Mean recreation</th><th>Mean water quality reg.</th></tr>${S.by_r11.map(r=>`<tr><td>${r.r11}</td><td>${r.rc.toFixed(2)}</td><td>${r.wq.toFixed(2)}</td></tr>`).join("")}</table></div><div><p class="sub">R11 is the only indicator used by two trees. Across all joint combinations, the two ES scores have a rank correlation of only <b>ρ = ${S.rho.toFixed(2)}</b>: they're largely independent. R11 behaves differently in each tree. In recreation it stops mattering above 3; in water quality it keeps raising the score up to 5.</p></div></div></section>`;
  h += `<section><h2>Using the framework</h2><pre>es_framework/
├── R/es_original.R      # the five trees, verbatim from the script (reference)
├── R/es_models.R        # editable versions (all rule values in a params list) + input specs
├── R/es_sensitivity.R   # Sobol, flip rates, hotspots, rule criticality, correlation, property checks
├── tests/test_all.R     # validation tests: 22 tests, all pass
├── run_all.R            # runs everything → outputs/&lt;es&gt;/*.csv, outputs/plots/*.png, results.json
└── report/              # template.html + build_report.R → this page</pre>
<pre>Rscript tests/test_all.R            # validate all five trees
Rscript run_all.R                   # full analysis
Rscript report/build_report.R       # rebuild this report (run_all.R also does this)

# Re-weight with real indicator frequencies (e.g. RSN data) for any ES:
w &lt;- list(r1 = prop.table(table(real$r1)), r21 = prop.table(table(real$r21)))
g &lt;- es_grid(ES$hm); sobol_exact(ES$hm, g, hm_original(g), w)

# Test a restructured tree: edit any rule and re-check properties
p &lt;- hm_params(); p$Leaves[1] &lt;- 2                     # soften the R1 = 1 veto
property_checks(ES$hm, function(d) hm_model(d, p))
p &lt;- rc_params(); p$T3[4, ] &lt;- c(3, 4, 4, 5, 5)          # fix recreation's non-monotonic row
property_checks(ES$rc, function(d) rc_model(d, p))</pre></section>`;
  return h;
}

/* ------------------------------ routing ---------------------------------- */
const TABS = [["overview","Overview"], ...ORDER.map(k => [SLUG[k], R.es[k].name])];
function route(){
  const slug = (location.hash || "#overview").slice(1);
  const k = ORDER.find(x => SLUG[x] === slug);
  document.getElementById("nav").innerHTML = TABS.map(([s,n]) => `<a href="#${s}" class="${s===(k?slug:"overview")?"on":""}">${n}</a>`).join("");
  const app = document.getElementById("app");
  if (!k) { app.innerHTML = overview(); bindTips(app); window.scrollTo(0,0); return; }
  app.innerHTML = esPage(k); bindTips(app);
  drawFlips(k, "flip_rate"); drawHS(k, "sens"); drawPairs(k); drawRules(k);
  const wire = (id, fn) => document.getElementById(id).addEventListener("click", e => { const m = e.target.dataset.m; if (!m) return;
    document.querySelectorAll("#"+id+" button").forEach(b => b.classList.toggle("on", b.dataset.m===m)); fn(m); });
  wire("fm-"+k, m => drawFlips(k, m)); wire("hm-"+k, m => drawHS(k, m));
  window.scrollTo(0,0);
}
addEventListener("hashchange", route); route();
</script>
